<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>自動題單本機測試</title>
<h1>本機題單測試，不連線 Firebase</h1><button id="seed">備份並建立三人待開始房間</button><button id="restore">還原測試前資料</button><p id="state"></p>
<script type="module">
import {newRoom} from '../src/game.js';
if(!['127.0.0.1','localhost'].includes(location.hostname))throw Error('Local only');
const key='hoho-spotlight-demo-v1',backup='hoho-plan-fixture-backup';
document.querySelector('#seed').onclick=()=>{
 if(!localStorage.getItem(backup))localStorage.setItem(backup,JSON.stringify({value:localStorage.getItem(key)}));
 const r=newRoom('PARTY1');for(let i=0;i<3;i++)r.public.members['demo-friend-'+i]={name:['示範小美','示範阿樂','示範琪琪'][i],seat:String(i),code:'PARTY1',joined:i+1,demo:true};
 localStorage.setItem(key,JSON.stringify(r));document.querySelector('#state').textContent='三人待開始房間已建立';
};
document.querySelector('#restore').onclick=()=>{const b=JSON.parse(localStorage.getItem(backup)||'null');if(b){b.value===null?localStorage.removeItem(key):localStorage.setItem(key,b.value);localStorage.removeItem(backup);}document.querySelector('#state').textContent='已還原';};
</script></html>
